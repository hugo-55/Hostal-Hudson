<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sin conexión | Hostal Hudson</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #fafaf9; color: #1c1917; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; line-height: 1.6;
  }
  .box { max-width: 480px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: #78716c; margin: 0 0 20px; }
  .en { font-size: 14px; color: #78716c; margin-top: 24px; border-top: 1px solid #e7e5e4; padding-top: 16px; }
  button {
    background: #16a34a; color: #fff; border: 0; border-radius: 999px;
    padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: .9; }
</style>
</head>
<body>
  <div class="box">
    <h1>Estás sin conexión</h1>
    <p>No pudimos cargar la página. Revisa tu internet y vuelve a intentarlo — o escríbenos por WhatsApp para reservar igual.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <p class="en">You're offline. Check your connection and try again.</p>
  </div>
</body>
</html>
